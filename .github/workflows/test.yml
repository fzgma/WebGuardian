name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            runner: ubuntu-26.04

          - name: Ubuntu ARM64
            runner: ubuntu-26.04-arm

          - name: Windows x64
            runner: windows-latest

          - name: macOS ARM64
            runner: macos-26

          - name: macOS x64
            runner: macos-26-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Install Python versions
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.10 3.11 3.12 3.13 3.14 3.15

      - name: Run tests on each Python version
        shell: bash
        run: |
          set -uo pipefail

          versions=(3.10 3.11 3.12 3.13 3.14 3.15)
          failures=0

          for version in "${versions[@]}"; do
            echo "::group::Python $version"

            if uv run \
              --no-project \
              --python "$version" \
              --with-requirements requirements.txt \
              --with pytest \
              -- python -m pytest tests -v; then
              echo "Python $version: PASS"
            else
              status=$?
              echo "Python $version: FAIL (exit $status)"
              failures=$((failures + 1))
            fi

            echo "::endgroup::"
          done

          if (( failures > 0 )); then
            echo "::error::$failures Python version(s) failed."
            exit 1
          fi