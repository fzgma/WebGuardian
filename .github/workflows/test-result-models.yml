name: Test Result Models

on:
  push:
  pull_request:

jobs:
  test-result-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run result model tests
        run: python -m unittest tests.test_result_models -v
